[workspace]
name = "slidecast"
version = "0.2.1"
description = "Self-contained presentation decks with a phone remote"
authors = ["David Fullmer <david.d.fullmer@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.110"
uvicorn = ">=0.27"
# Optional: prints a scannable QR for the remote URL, and renders the offline
# fallback QR for external embeds. The server degrades gracefully without it.
qrcode = ">=7.4"
# Optional: downscales oversized images before embedding them, so a phone photo
# doesn't add megabytes to the deck. Images embed unchanged if it's missing.
pillow = ">=10.0"

[tasks]
# Start the presentation server on the local network.
start = { cmd = "python -m slidecast", description = "Serve a deck + phone remote on the LAN" }
# Localhost only, for testing without exposing to the network.
local = { cmd = "python -m slidecast --host 127.0.0.1", description = "Serve on localhost only" }
# Build every deck in decks/ to a standalone offline file in build/.
build = { cmd = "python -m slidecast.build", description = "Build all decks to standalone HTML" }
# Open straight into a particular deck.
tour = { cmd = "python -m slidecast --deck tour", description = "Present the guided tour of Slidecast" }
gallery = { cmd = "python -m slidecast --deck gallery", description = "Present the layout gallery" }
