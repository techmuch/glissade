<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glissade</title>
<style>
/*__DECK_CSS__*/
</style>
</head>
<body>

<div id="live" role="status"><i aria-hidden="true"></i><span>connecting…</span></div>
<aside id="help" aria-label="Keyboard shortcuts"><kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>N</kbd> notes &nbsp;·&nbsp; <kbd>B</kbd> blank &nbsp;·&nbsp; <kbd>D</kbd> decks &nbsp;·&nbsp; <kbd>+</kbd> <kbd>−</kbd> text &nbsp;·&nbsp; <kbd>T</kbd> theme &nbsp;·&nbsp; <kbd>R</kbd> reload embed &nbsp;·&nbsp; <kbd>F</kbd> fullscreen &nbsp;·&nbsp; <kbd>?</kbd> this help</aside>
<div id="scaletoast" role="status" aria-live="polite"><b id="scaleval">100%</b><span>text size</span></div>
<main id="stage"></main>
<!-- Announces each slide change to screen readers: "Slide 3 of 6: heading". -->
<div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="notes" role="region" aria-label="Speaker notes"></div>
<div id="blank" aria-hidden="true"></div>
<div id="livenotes" aria-label="Live notes overlay">
  <div class="ln-head">
    <div>
      <div class="ln-title">Live notes</div>
      <div class="ln-state" id="lnstate">Slide 1</div>
    </div>
    <div class="ln-tag">Presenter only</div>
  </div>
  <div class="ln-body" id="lnbody"></div>
</div>
<div id="deckpicker" role="dialog" aria-modal="true" aria-labelledby="dptitle" aria-describedby="dphint">
  <div class="dp-card">
    <div class="dp-head">
      <h2 class="dp-title" id="dptitle">Switch Deck</h2>
      <div class="dp-hint" id="dphint">↑↓ navigate · Enter select · Esc close</div>
    </div>
    <div class="dp-list" id="dplist" role="listbox" tabindex="-1" aria-labelledby="dptitle"></div>
  </div>
</div>

<script>
const SLIDES = __SLIDES_JSON__;
const THEMES = __THEMES_JSON__;
const DECK_THEME = __DECK_THEME__;
const DECKS = __DECKS_JSON__;
const DECK_TITLE = __TITLE__;
const LIVE = __LIVE__;
let currentDeckId = __CURRENT_DECK__;

/*__DECK_JS__*/
</script>
</body>
</html>
