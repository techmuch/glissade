<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glissade</title>
<style>
  /* Theme tokens. These are the built-in "Paper" defaults; the deck
     overwrites them on :root at runtime from themes.json, so every colour and
     face below has to come from a variable -- anything hardcoded would ignore
     the selected theme. */
  :root{
    --ink:#1e2430;
    --ink-soft:#4a5568;
    --paper:#f6f3ee;
    --accent:#7a5c2e;
    --accent-light:#b8955a;
    --rule:#ddd5c8;
    --surround:#2a2723;
    --story-bg:#efe9df;
    --ask-bg:#2f3a3f;
    --ask-ink:#e8e2d6;
    --ask-ink-soft:#c3cbcd;
    --ask-heading:#ffffff;
    --ask-accent:#c4a265;
    --overlay-bg:rgba(20,18,16,.95);
    --overlay-ink:#e6e0d4;
    --chrome-ink:#9a9186;
    --blank-bg:#14120f;
    --deck-font:Georgia,'Iowan Old Style','Times New Roman',serif;
    --ui-font:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    /* Two faces, two jobs: headings and quotes in the display face, reading
       text in the body face. A theme that sets only --deck-font gets it for
       both, which is how themes written before the split still render. */
    --display-font:var(--deck-font);
    --body-font:var(--deck-font);
    --heading-weight:400;
    --heading-tracking:-0.01em;
    /* Surfaces for cards, callouts and side panels. Callouts are filled with
       the accent, so their text takes the page colour. */
    --card-bg:rgba(255,255,255,.55);
    --callout-bg:var(--accent);
    --callout-ink:var(--paper);
    --ask-callout-bg:var(--ask-accent);
    --ask-callout-ink:var(--ask-bg);
    /* One type scale for the whole deck. Every size on a slide comes from
       these five steps (times --scale), so slides share one hierarchy. */
    --fs-display:7.6vh;
    --fs-h2:5.2vh;
    --fs-h3:3.3vh;
    --fs-body:3vh;
    --fs-small:2.3vh;
    --fs-label:1.7vh;
    /* Global text scale. Everything on a slide is sized in vh and
       multiplied by this, so one number resizes the whole deck. */
    --scale:1;
  }
  /*__FONT_FACES__*/
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--surround);
    font-family:var(--body-font);
    color:var(--ink);
    overflow:hidden;
  }
  :focus-visible{outline:3px solid var(--accent-light); outline-offset:3px}
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  @media (prefers-reduced-motion: reduce){
    *,*:before,*:after{animation:none !important; transition:none !important}
  }
  #stage{
    position:fixed; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    transition:bottom .15s ease;
  }
  /* With notes open the slide gets the remaining height rather than being
     covered by them -- and media refits into the smaller area. */
  body.notes-on #stage{bottom:var(--notes-h, 0px)}
  .slide{
    display:none;
    width:100%; height:100%;
    background:var(--paper);
    padding:5vh 7vw;
    flex-direction:column;
    /* `safe center` keeps the top of the slide reachable if a large text
       scale makes the content taller than the screen; plain `center` would
       clip it out of view. The first declaration is the fallback. */
    justify-content:center;
    justify-content:safe center;
    overflow-y:auto;
    position:relative;
    animation:fade .25s ease;
  }
  .slide > *{flex-shrink:0}
  .slide.active{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .eyebrow{
    font-family:var(--ui-font);
    font-size:calc(var(--fs-label) * var(--scale)); letter-spacing:.2em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin-bottom:2vh;
  }
  h1,h2,h3{font-family:var(--display-font); font-weight:var(--heading-weight); letter-spacing:var(--heading-tracking)}
  h1{font-size:calc(var(--fs-display) * var(--scale)); line-height:1.08}
  h2{font-size:calc(var(--fs-h2) * var(--scale)); line-height:1.15; margin-bottom:3.5vh}
  h3{font-size:calc(var(--fs-h3) * var(--scale)); line-height:1.25; color:var(--accent); margin-bottom:2.5vh}
  p{font-size:calc(var(--fs-body) * var(--scale)); line-height:1.5; color:var(--ink-soft); max-width:46ch}
  .lead{font-size:calc(3.4vh * var(--scale)); color:var(--ink)}
  /* `body` is authored HTML that may or may not wrap itself in <p>. */
  .body{font-size:calc(var(--fs-body) * var(--scale)); line-height:1.5; color:var(--ink-soft)}
  .body > * + *{margin-top:1.4vh}

  .byline{
    margin-top:4vh; font-size:calc(2.6vh * var(--scale)); color:var(--ink-soft);
    border-top:1px solid var(--rule); padding-top:3vh; max-width:40ch;
  }
  .byline strong{color:var(--ink); font-weight:600; display:block; font-size:calc(2.9vh * var(--scale))}
  .byline span{font-size:calc(var(--fs-small) * var(--scale)); display:block; margin-top:.6vh}

  /* A pull quote is a figure: the quotation, then who said it. */
  .pull{
    border-left:.6vh solid var(--accent-light); padding-left:calc(3.5vh * var(--scale));
    max-width:34ch;
  }
  blockquote{
    font-family:var(--display-font);
    font-size:calc(3.6vh * var(--scale)); line-height:1.4; color:var(--ink);
  }
  .pull.big{max-width:28ch}
  .pull.big blockquote{font-size:calc(4.6vh * var(--scale)); font-style:italic; line-height:1.3}
  blockquote em{font-style:italic; color:var(--accent); font-weight:600}
  .pull figcaption{margin-top:2.6vh}
  cite{
    display:block; font-style:normal;
    font-family:var(--ui-font); font-weight:600;
    font-size:calc(1.9vh * var(--scale)); letter-spacing:.06em; color:var(--accent); text-transform:uppercase;
  }

  ul,ol{list-style:none; max-width:44ch}
  li{
    font-size:calc(3.1vh * var(--scale)); line-height:1.4; margin-bottom:2.8vh;
    padding-left:calc(4.5vh * var(--scale)); position:relative; color:var(--ink);
  }
  li:before{
    content:''; position:absolute; left:0; top:calc(1.5vh * var(--scale));
    width:calc(1.6vh * var(--scale)); height:calc(1.6vh * var(--scale)); border:.3vh solid var(--accent); border-radius:50%;
  }
  /* A bullet with a second line reads as a title and its explanation. */
  li .li-t{display:block; font-weight:650}
  li small{display:block; font-size:calc(var(--fs-small) * var(--scale)); color:var(--ink-soft); margin-top:.8vh; line-height:1.45}

  /* ---- callout: the one thing to take away, always last ---- */
  .callout{
    background:var(--callout-bg); color:var(--callout-ink);
    border-radius:1.2vh; padding:2.6vh 2.4vw;
    font-size:calc(var(--fs-body) * var(--scale)); line-height:1.45;
    max-width:none;
  }
  .callout p{color:inherit; font-size:inherit; max-width:none}
  .callout b,.callout strong{font-weight:700}

  .slide.ask{background:var(--ask-bg); color:var(--ask-ink)}
  .slide.ask .eyebrow{color:var(--ask-accent)}
  .slide.ask h1,.slide.ask h2{color:var(--ask-heading)}
  .slide.ask h2{max-width:24ch}
  .slide.ask p,.slide.ask .body{color:var(--ask-ink-soft)}
  .slide.ask li,.slide.ask blockquote{color:var(--ask-ink)}
  .slide.ask li:before{border-color:var(--ask-accent)}
  .slide.ask li small{color:var(--ask-ink-soft)}
  .slide.ask h3,.slide.ask cite{color:var(--ask-accent)}
  .slide.ask .callout{background:var(--ask-callout-bg); color:var(--ask-callout-ink)}

  .slide.story{background:var(--story-bg)}
  .dialogue{max-width:44ch}
  .dialogue p{font-size:calc(3vh * var(--scale)); margin-bottom:2.2vh}
  .dialogue p.q{color:var(--ink); font-style:italic}
  .dialogue p.a{padding-left:calc(4vh * var(--scale))}

  .center{align-items:center; text-align:center}
  .center p,.center .pull,.center ul{max-width:38ch}
  .center .pull{border-left:none; padding-left:0; border-top:1px solid var(--rule); padding-top:3.5vh}

  /* Slide chrome. Kept quiet, but at a contrast that still reads. */
  .num{
    position:absolute; bottom:3.5vh; right:5vw;
    font-family:var(--ui-font); font-variant-numeric:tabular-nums;
    font-size:calc(var(--fs-label) * var(--scale)); color:var(--ink-soft); letter-spacing:.1em;
  }
  .slide.ask .num{color:var(--ask-ink-soft)}
  .tag{
    position:absolute; top:4vh; left:6vw;
    font-family:var(--ui-font); font-weight:600;
    font-size:calc(1.5vh * var(--scale)); letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
  }
  .slide.ask .tag{color:var(--ask-accent)}
  /* Source line: where a quote or figure came from, pinned to the foot. */
  .source{
    position:absolute; left:6vw; right:16vw; bottom:3.5vh;
    font-family:var(--ui-font);
    font-size:calc(var(--fs-label) * var(--scale)); line-height:1.4; color:var(--ink-soft);
  }
  .slide.ask .source{color:var(--ask-ink-soft)}

  #notes{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--overlay-bg); color:var(--overlay-ink);
    font-family:var(--ui-font);
    font-size:15px; line-height:1.5; padding:16px 24px;
    max-height:34vh; overflow:auto; display:none; border-top:2px solid var(--accent-light);
  }
  #notes.on{display:block}
  #notes b{color:var(--ask-accent)}
  /* Keyboard help. Shown for a few seconds on load and whenever ? is pressed,
     then gets out of the way -- it must never sit on top of the slide. */
  #help{
    position:fixed; top:12px; right:16px; z-index:26;
    font-family:var(--ui-font); font-size:13px; line-height:1.4; letter-spacing:.02em;
    background:var(--overlay-bg); color:var(--overlay-ink);
    padding:8px 14px; border-radius:8px; max-width:calc(100vw - 32px);
    opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s;
  }
  #help.on{opacity:1; visibility:visible}
  #help kbd{font-family:inherit; font-weight:700}

  /* ==================== layouts ====================
     A slide is either legacy freeform markup (layout "blank") or a set of
     regions the renderer fills. Regions are sized in vh/vw so they track the
     text scale, and every colour comes from the theme tokens above. */

  /* Laid-out slides anchor their heading to the same top margin, so it never
     hops between slides; content flows down from it. Statement slides (title,
     title-only, section) and anything marked `center` stay vertically centred
     -- for those, the middle of the screen *is* the consistent place. */
  .slide.lay{padding:8vh 6vw 9vh; justify-content:flex-start; gap:3vh}
  .slide.lay[data-layout="title"],
  .slide.lay[data-layout="title-only"],
  .slide.lay[data-layout="section"],
  .slide.lay.center{justify-content:center; justify-content:safe center}
  /* The corner tag is absolutely positioned, so slides that have one need the
     top of the content area pushed clear of it. Full-bleed slides are exempt —
     there the tag deliberately floats over the image. */
  .slide.has-tag:not(.bleed){padding-top:10vh}
  .slide.has-source:not(.bleed){padding-bottom:11vh}
  .region{min-width:0; min-height:0}          /* let flex children shrink */
  .stack{display:flex; flex-direction:column; justify-content:flex-start; min-width:0; min-height:0}
  /* A stack containing media grows to fill the slide so the media has a
     definite height to be measured against. */
  .stack.has-media{flex:1 1 auto}
  .stack > * + *{margin-top:1.6vh}
  /* Prose and lists, quotes and callouts are different kinds of thing; give
     the boundary between them more air than the space inside each. */
  .stack > .body + ul, .stack > .body + .pull, .stack > ul + .pull,
  .stack > * + .callout{margin-top:3vh}

  /* two-column frame shared by split/two-content/comparison */
  .cols{
    display:flex; gap:5vw; width:100%;
    /* Columns stretch so a media column has a definite height to fit against;
       text columns centre their own content, so this reads the same. */
    align-items:stretch;
    flex:1 1 auto; min-height:0;
  }
  .cols > *{min-height:0}
  .cols.top{align-items:flex-start}
  /* Text-only columns take their content's height, so whatever follows
     (a callout) sits right under them instead of at the foot of the slide.
     Columns holding media still stretch: the media needs a height to fit. */
  .cols:not(:has(.figure)){flex:0 1 auto}
  /* Top-aligned columns still need media to stretch, or there is no height. */
  .cols.top > .figure, .cols.top > .region.stack:has(.figure){align-self:stretch}
  .cols > .region{flex:1 1 0}
  .cols.wide-media > .media-region{flex:1.25 1 0}
  .cols.wide-text  > .text-region{flex:1.25 1 0}

  /* headings inside laid-out slides sit tighter than the freeform ones */
  .slide.lay h2{margin-bottom:2.2vh}
  .slide.lay h3{margin-bottom:1.4vh}
  .slide.lay p{margin-bottom:0}
  .slide.lay .stack ul{margin-top:.6vh}
  .slide.lay li{margin-bottom:1.8vh}
  /* Title-content slides should use the full readable width of the slide
     rather than the narrower default prose measure. Leave a right margin that
     matches the slide's left gutter so the text block still feels framed. */
  .slide.lay[data-layout="title-content"] .text-region{width:100%}
  .slide.lay[data-layout="title-content"] .text-region .subhead,
  .slide.lay[data-layout="title-content"] .text-region p,
  .slide.lay[data-layout="title-content"] .text-region ul,
  .slide.lay[data-layout="title-content"] .text-region .pull,
  .slide.lay[data-layout="title-content"] .text-region .body{
    max-width:calc(100% - 6vw);
  }
  /* Inside a column the column *is* the measure. A character cap on top of
     it is what squeezed text into half a column with the rest left empty. */
  .cols p,.cols ul,.cols ol,.cols .pull,.cols .subhead,.cols .body,
  .cols h2,.slide.ask .cols h2{max-width:none}
  /* A heading block before the content keeps its natural height. */
  .slide.lay > .text-region:first-child:not(:only-child){flex:0 0 auto}
  .slide.lay > .text-region h2:last-child{margin-bottom:0}

  .subhead{
    font-size:calc(2.6vh * var(--scale)); line-height:1.35;
    color:var(--ink-soft); max-width:40ch;
  }
  .slide.ask .subhead{color:var(--ask-ink-soft)}
  /* A column that opens with a subheading is labelled by it: give it the
     weight of a label, not the grey of a footnote. */
  .cols > .text-region > .subhead:first-child,
  .cols > .region > h3:first-child{
    font-family:var(--ui-font); font-weight:700; letter-spacing:.02em;
    font-size:calc(2.5vh * var(--scale)); color:var(--accent);
    padding-bottom:1.2vh; border-bottom:1px solid var(--rule); margin-bottom:.6vh;
  }
  .slide.ask .cols > .text-region > .subhead:first-child,
  .slide.ask .cols > .region > h3:first-child{color:var(--ask-accent); border-color:rgba(255,255,255,.16)}

  /* ---- media boxes (image or iframe) ---- */
  .media-box{
    position:relative; width:100%;
    background:rgba(0,0,0,.05); border-radius:.6vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .slide.ask .media-box{background:rgba(255,255,255,.06)}
  /* A ratio-locked box is measured against the space actually available and
     sized in JS (see fitMedia). Sizing from width alone -- the padding-bottom
     trick -- makes a 16:9 box taller than the slide on a wide screen, which is
     what produced scrollbars. */
  .media-box.fill{width:100%; height:100%}
  .media-box > img, .media-box > iframe{width:100%; height:100%; display:block}
  .media-box img{object-fit:contain}
  .media-box img.cover{object-fit:cover}
  .media-box iframe{border:0; background:#000}

  /* The slot is the measurable area a ratio-locked box gets to fill. */
  .fitslot{
    flex:1 1 auto; min-height:0; min-width:0; width:100%;
    display:flex; align-items:center; justify-content:center;
  }

  .figure{display:flex; flex-direction:column; min-width:0; min-height:0; flex:1 1 auto}
  .caption{
    font-family:var(--ui-font);
    font-size:calc(1.9vh * var(--scale)); line-height:1.4;
    color:var(--ink-soft); margin-top:1.4vh; max-width:60ch;
  }
  .slide.ask .caption{color:var(--ask-ink-soft)}
  .caption b{color:var(--ink); font-weight:600}
  .slide.ask .caption b{color:var(--ask-ink)}

  /* ---- full-bleed ---- */
  .slide.bleed{padding:0}
  .slide.bleed .media-box{
    position:absolute; inset:0; width:100%; height:100%;
    border-radius:0; background:#000;
  }
  .slide.bleed .media-box img{object-fit:cover}
  /* The scrim is what makes text over a photograph readable; it is darkest
     exactly where the text sits. `bottom` suits wide shots, `left` suits a
     subject on the right, `none` is for images already dark enough. */
  .slide.bleed .overlay{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:8vh 7vw 7vh;
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.55) 55%, rgba(0,0,0,0));
    color:#fff;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .slide.bleed .overlay.scrim-left{
    top:0; right:auto; width:64%;
    padding:8vh 6vw 9vh 7vw;
    background:linear-gradient(to right, rgba(0,0,0,.85) 0%, rgba(0,0,0,.7) 55%, rgba(0,0,0,0) 100%);
  }
  .slide.bleed .overlay.scrim-none{background:none; text-shadow:0 .2vh 1.6vh rgba(0,0,0,.85)}
  .slide.bleed .overlay h1{color:#fff; max-width:20ch}
  .slide.bleed .overlay h2{color:#fff; max-width:22ch}
  .slide.bleed .overlay p,.slide.bleed .overlay .body{color:rgba(255,255,255,.92); max-width:46ch; margin-top:2vh}
  .slide.bleed .overlay .eyebrow{color:#fff}
  .slide.bleed .num,.slide.bleed .tag,.slide.bleed .source{
    color:#fff; z-index:3; text-shadow:0 .1vh .8vh rgba(0,0,0,.9);
  }

  /* ---- cards: two to four parallel ideas, side by side ---- */
  /* Cards share one height (the tallest), grow to use the slide, but stop
     well short of the foot so a short card isn't mostly empty box. */
  .cards{
    display:grid; grid-template-columns:repeat(var(--n, 3), minmax(0, 1fr));
    gap:2.4vw; width:100%; max-width:none; flex:1 1 auto; min-height:0;
    max-height:52vh; grid-auto-rows:1fr;
  }
  .cards > li.card{
    display:flex; flex-direction:column; gap:1.4vh; min-height:0; min-width:0;
    margin:0; padding:3.4vh 2vw 3vh; position:static;
    background:var(--card-bg); color:var(--ink);
    border:1px solid var(--rule); border-top:.7vh solid var(--accent);
    border-radius:1.4vh; font-size:inherit;
  }
  .cards > li.card:before{display:none}
  .card-n{
    font-family:var(--display-font); color:var(--accent);
    font-size:calc(5.4vh * var(--scale)); line-height:1;
  }
  .card h3{
    font-family:var(--display-font); color:var(--ink); font-weight:600;
    font-size:calc(3.6vh * var(--scale)); line-height:1.2; margin:0;
  }
  .card .body{font-size:calc(var(--fs-body) * var(--scale)); line-height:1.45}
  .card-src{
    margin-top:auto; padding-top:1.4vh;
    font-family:var(--ui-font); font-weight:700; letter-spacing:.03em;
    font-size:calc(var(--fs-label) * var(--scale)); line-height:1.4; color:var(--accent);
  }
  .card-img{
    display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
    border-radius:.8vh; margin-bottom:.6vh;
  }
  .slide.ask .cards > li.card{
    background:rgba(255,255,255,.05); color:var(--ask-ink);
    border-color:rgba(255,255,255,.16); border-top-color:var(--ask-accent);
  }
  .slide.ask .card h3{color:var(--ask-heading)}
  .slide.ask .card-n,.slide.ask .card-src{color:var(--ask-accent)}
  .cards.n4 .card h3{font-size:calc(3vh * var(--scale))}
  .cards.n4 .card .body{font-size:calc(2.5vh * var(--scale))}

  /* ---- quote layout: the quote, and what to do with it ---- */
  .quote-cols{gap:4vw}
  .quote-cols > .pull{flex:3 1 0; max-width:none; align-self:flex-start}
  .quote-cols > .side-panel{
    flex:2 1 0; align-self:flex-start;
    display:flex; flex-direction:column; gap:1.8vh;
    background:var(--story-bg); border-radius:1.4vh; padding:4vh 2.6vw;
  }
  .slide.story .quote-cols > .side-panel{background:var(--card-bg)}
  .slide.ask .quote-cols > .side-panel{background:rgba(255,255,255,.06)}
  .side-panel h3{margin:0; font-family:var(--ui-font); font-weight:700; font-size:calc(2.4vh * var(--scale)); letter-spacing:.02em}
  .side-panel ul{margin:0}
  .side-panel li{font-size:calc(2.6vh * var(--scale)); margin-bottom:1.4vh}
  .side-panel li:before{top:calc(1.2vh * var(--scale))}

  /* ---- grid ---- */
  .grid{
    display:grid; gap:2.4vh 2.2vw; width:100%; flex:1 1 auto; min-height:0;
    align-content:stretch; grid-auto-rows:1fr;
  }
  .grid.n2{grid-template-columns:repeat(2,1fr)}
  .grid.n3{grid-template-columns:repeat(3,1fr)}
  .grid.n4{grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr)}
  .grid .figure{min-height:0}
  .grid .caption{
    font-size:calc(1.6vh * var(--scale)); margin-top:.9vh; text-align:center;
  }
  .grid .media-box{background:rgba(0,0,0,.06)}

  /* ---- quad chart ---- */
  .quad-chart{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    grid-template-rows:repeat(2, minmax(0, 1fr));
    gap:2.6vh 2.2vw;
    width:100%;
    flex:1 1 auto;
    min-height:0;
  }
  .quad-card{
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;

  /* ---- section header ---- */

  /* ---- external-embed fallback ---- */

  /* Blank-screen overlay, toggled from the remote or with B */

  /* Presenter-written live notes, optional on the projector. */
  #livenotes{
    position:fixed;

  #livenotes.on{display:flex}
  #livenotes .ln-head{

    padding:12px 16px 10px; border-bottom:1px solid rgba(192,168,120,.22);

  #livenotes .ln-title{

  #livenotes .ln-tag{

  /* Live-connection dot, only shown when served by the lesson server */
  #live{
    position:fixed; top:12px; left:16px; z-index:6;
    font-family:var(--ui-font);
    font-size:11px; letter-spacing:.08em; color:var(--chrome-ink); display:none; align-items:center; gap:6px;
  }
  #live.show{display:flex}
  #live i{width:7px; height:7px; border-radius:50%; background:#c0642f; display:block}
  #live.ok i{background:#5f8a4e}

  /* Brief confirmation of the new text size, so you can tell it registered
     from across the room. Fades itself out. */
  #scaletoast{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--overlay-bg); color:var(--overlay-ink); z-index:25;
    font-family:var(--ui-font);

    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  #scaletoast.on{opacity:1}
  #scaletoast b{display:block; font-size:34px; font-weight:600; letter-spacing:.01em}
  #scaletoast span{
    display:block; font-size:10.5px; letter-spacing:.2em;

  /* Deck switcher overlay, toggled with D */
  #deckpicker{
    position:fixed; inset:0; z-index:35;
    display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.68);

    -webkit-backdrop-filter:blur(5px);

  #deckpicker.on{display:flex}
  .dp-card{
    background:rgba(20,18,16,.96);
    color:var(--overlay-ink,#e6e0d4);
    border:1px solid rgba(192,168,120,.35);
    border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    width:min(90vw, 560px);
    max-height:80vh;
    display:flex; flex-direction:column;
    overflow:hidden;
    font-family:var(--ui-font);
    animation:dp-fade .15s ease-out;
  }
  @keyframes dp-fade{
    from{opacity:0; transform:scale(.97)}
    to{opacity:1; transform:scale(1)}
  }
  .dp-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:16px 20px 14px;
    border-bottom:1px solid rgba(192,168,120,.2);
  }
  .dp-title{
    font-family:var(--ui-font); margin:0; line-height:1.3;
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;

  .dp-key{

    flex:none; font-variant-numeric:tabular-nums;
  }
  .dp-info{flex:1; min-width:0}

  }

  @media print{
    body{background:#fff; overflow:visible}
    #stage{position:static}
    .slide{display:flex !important; page-break-after:always; height:100vh; animation:none}
    #notes,#help,#live,#blank,#scaletoast,#livenotes,#deckpicker{display:none}

</style>

<body>

<div id="live" role="status"><i aria-hidden="true"></i><span>connecting…</span></div>
<aside id="help" aria-label="Keyboard shortcuts"><kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>N</kbd> notes &nbsp;·&nbsp; <kbd>B</kbd> blank &nbsp;·&nbsp; <kbd>D</kbd> decks &nbsp;·&nbsp; <kbd>+</kbd> <kbd>−</kbd> text &nbsp;·&nbsp; <kbd>T</kbd> theme &nbsp;·&nbsp; <kbd>R</kbd> reload embed &nbsp;·&nbsp; <kbd>F</kbd> fullscreen &nbsp;·&nbsp; <kbd>?</kbd> this help</aside>
<div id="scaletoast" role="status" aria-live="polite"><b id="scaleval">100%</b><span>text size</span></div>
<main id="stage"></main>
<!-- Announces each slide change to screen readers: "Slide 3 of 6: heading". -->
<div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="notes" role="region" aria-label="Speaker notes"></div>
<div id="blank" aria-hidden="true"></div>
<div id="livenotes" aria-label="Live notes overlay">
  <div class="ln-head">
    <div>
      <div class="ln-title">Live notes</div>
      <div class="ln-state" id="lnstate">Slide 1</div>
    </div>
    <div class="ln-tag">Presenter only</div>
  </div>
  <div class="ln-body" id="lnbody"></div>
</div>
<div id="deckpicker" role="dialog" aria-modal="true" aria-labelledby="dptitle" aria-describedby="dphint">
  <div class="dp-card">
    <div class="dp-head">
      <h2 class="dp-title" id="dptitle">Switch Deck</h2>
      <div class="dp-hint" id="dphint">↑↓ navigate · Enter select · Esc close</div>
    </div>
    <div class="dp-list" id="dplist" role="listbox" tabindex="-1" aria-labelledby="dptitle"></div>
  </div>
</div>

<script>
const SLIDES = __SLIDES_JSON__;
const THEMES = __THEMES_JSON__;
const DECK_THEME = __DECK_THEME__;
const DECKS = __DECKS_JSON__;
const DECK_TITLE = __TITLE__;
const LIVE = __LIVE__;
let currentDeckId = __CURRENT_DECK__;

document.title = DECK_TITLE;
document.getElementById('stage').setAttribute('aria-label', DECK_TITLE);

/* Keyboard help: visible for a moment on load so it's discoverable, then
   hidden so it never sits on a projected slide. ? or H brings it back. */
const helpEl = document.getElementById('help');
let helpTimer = null;
function showHelp(ms){
  helpEl.classList.add('on');
  clearTimeout(helpTimer);
  helpTimer = setTimeout(() => helpEl.classList.remove('on'), ms || 5000);
}
function toggleHelp(){
  if(helpEl.classList.contains('on')){ clearTimeout(helpTimer); helpEl.classList.remove('on'); }
  else showHelp(8000);
}
showHelp(4000);

const MIN_SCALE = 0.7, MAX_SCALE = 1.6, SCALE_STEP = 0.1;

const stage = document.getElementById('stage');
const notesEl = document.getElementById('notes');
const blankEl = document.getElementById('blank');
const liveNotesEl = document.getElementById('livenotes');
const liveNotesBodyEl = document.getElementById('lnbody');
const liveNotesStateEl = document.getElementById('lnstate');
const liveEl = document.getElementById('live');
const toastEl = document.getElementById('scaletoast');
const deckPickerEl = document.getElementById('deckpicker');
const dpListEl = document.getElementById('dplist');
let i = 0, notesOn = false, blanked = false, scale = 1, liveNotesVisible = false, liveNoteText = '';
let themeId = (THEMES[0] || {}).id || 'paper';
let deckPickerOpen = false, dpFocusedIdx = 0;

/* ==================== layout renderer ====================
   Every layout is built from three region kinds: text, image, and embed.
   A slide with no `layout` is treated as "blank" and its raw `html` is used
   verbatim, so decks written before layouts existed render unchanged. */

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function aspectRatio(a){
  if(!a) return null;
  if(typeof a === 'number') return a;
  const m = String(a).split(/[:\/x]/);
  if(m.length === 2){
    const w = parseFloat(m[0]), h = parseFloat(m[1]);
    if(w > 0 && h > 0) return w / h;
  }
  const n = parseFloat(a);
  return n > 0 ? n : null;
}

/* Text region: any subset of eyebrow / heading / subhead / body / bullets.
   `body` and bullet text are authored as HTML so quotes and emphasis work. */
function textRegion(o){
  const box = el('div', 'region stack text-region');
  if(o.eyebrow)  box.appendChild(el('div', 'eyebrow', o.eyebrow));
  if(o.heading)  box.appendChild(el(o.headingLevel === 1 ? 'h1' : 'h2', null, o.heading));
  if(o.subheading) box.appendChild(el('div', 'subhead', o.subheading));
  if(o.body)     box.appendChild(el('div', 'body', o.body));
  if(o.bullets && o.bullets.length) box.appendChild(bulletList(o.bullets));
  if(o.quote)    box.appendChild(pullQuote(o.quote, o.cite, o.quoteBig));
  /* The callout always comes last, whatever order the fields were written
     in: it is the takeaway, so it closes the slide. */
  if(o.callout)  box.appendChild(callout(o.callout));
  return box;
}

/* A bullet given as {text, sub} is a title and its explanation; the title
   gets weight so the two read as two levels, not two sizes of the same. */
function bulletList(items){
  const ul = el('ul');
  items.forEach(b => {
    if(b && typeof b === 'object'){
      const li = el('li', b.sub ? 'has-sub' : null);
      li.appendChild(el('span', 'li-t', b.text == null ? '' : String(b.text)));
      if(b.sub) li.appendChild(el('small', null, b.sub));
      ul.appendChild(li);
    } else {
      ul.appendChild(el('li', null, String(b)));
    }
  });
  return ul;
}

/* A quotation and its source belong together, so they are a figure. */
function pullQuote(text, cite, big){
  const f = el('figure', 'pull' + (big ? ' big' : ''));
  f.appendChild(el('blockquote', null, text));
  if(cite){
    const cap = el('figcaption');
    cap.appendChild(el('cite', null, cite));
    f.appendChild(cap);
  }
  return f;
}

function callout(html){
  const c = el('div', 'callout', html);
  c.setAttribute('role', 'note');
  return c;
}

/* Cards: two to four parallel ideas. A numbered set is an ordered list, so
   assistive tech hears "list, 3 items" and the position of each -- the big
   visible numeral is decoration on top of that, and hidden from it. */
function cardList(cards, numbered){
  const items = (Array.isArray(cards) ? cards : []).filter(c => c && typeof c === 'object');
  const n = Math.min(4, Math.max(1, items.length));
  const list = el(numbered ? 'ol' : 'ul', 'cards n' + n);
  list.style.setProperty('--n', n);
  items.forEach((c, k) => {
    const li = el('li', 'card');
    if(c.image && c.image.src){
      const img = el('img', 'card-img');
      img.src = c.image.src;
      img.alt = c.image.alt || '';
      if(c.image.focus) setFocus(img, c.image.focus);
      li.appendChild(img);
    }
    if(numbered){
      const num = el('div', 'card-n', String(k + 1));
      num.setAttribute('aria-hidden', 'true');
      li.appendChild(num);
    }
    if(c.title)  li.appendChild(el('h3', null, c.title));
    if(c.body)   li.appendChild(el('div', 'body', c.body));
    if(c.source) li.appendChild(el('div', 'card-src', c.source));
    list.appendChild(li);
  });
  return list;
}

/* Where to anchor a cropped image: keywords or percentages only. */
function setFocus(img, focus){
  const f = String(focus || '').trim();
  if(/^[a-z0-9%.\s-]{1,40}$/i.test(f)) img.style.objectPosition = f;
}

/* An image or an embed, in a box that can hold an aspect ratio. Embeds are
   NOT created here — only a placeholder is, so nothing loads until the slide
   is actually shown. */
/* "auto" means: take all the space there is, don't hold a ratio. Activities
   want this; a video does not, or it gets letterboxed by the player. */
function defaultAspect(node){
  if(node.kind === 'image') return null;        // images fit via object-fit
  return node.srcdoc != null ? 'auto' : '16:9';
}

function mediaBox(node, opts){
  opts = opts || {};
  /* `force` is for layouts whose shape is not negotiable — full-bleed fills
     the screen whatever the slide asked for. */
  const want = opts.force ? opts.aspect : (node.aspect || opts.aspect || defaultAspect(node));
  const ar = (want === 'auto' || want === 'fill') ? null : aspectRatio(want);
  const box = el('div', 'media-box ' + (ar ? 'ar' : 'fill'));
  if(ar) box.dataset.ar = ar;

  if(node.kind === 'image'){
    const img = el('img');
    img.src = node.src;
    img.alt = node.alt || '';
    if((node.fit || opts.fit) === 'cover') img.className = 'cover';
    if(node.focus) setFocus(img, node.focus);
    if(node.remote) img.addEventListener('error', () => {
      box.appendChild(fallbackPanel(node.src, 'Image could not load'));
      box.querySelector('.embed-fallback').classList.add('on');
    });
    box.appendChild(img);
  } else {
    // Deferred embed: remember the spec, mount on activation.
    box.dataset.embed = '1';
    EMBEDS.set(box, node);
    box.appendChild(fallbackPanel(node.src, node.fallback_label, node.qr));
  }
  return box;
}

function fallbackPanel(url, label, qr){
  const p = el('div', 'embed-fallback');
  p.appendChild(el('div', 'ef-title', label ? 'Can’t reach ' + label : 'This embed needs internet'));
  if(qr){
    const q = el('img');
    q.src = qr; q.alt = 'QR code linking to ' + (url || '');
    p.appendChild(q);
  }
  if(url) p.appendChild(el('div', 'ef-url', url));
  p.appendChild(el('div', 'ef-hint', qr ? 'Scan to open it on a phone' : 'Check the connection and press R to retry'));
  return p;
}

function figure(node, opts){
  const f = el('figure', 'figure region');
  const slot = el('div', 'fitslot');
  slot.appendChild(mediaBox(node, opts));
  f.appendChild(slot);
  if(node.caption) f.appendChild(el('figcaption', 'caption', node.caption));
  return f;
}

/* Normalise "what goes in this region" — a slide may put an image or an embed
   in the same slot, and left/right blocks may carry either. */
function pickMedia(o){
  if(!o) return null;
  if(o.image && typeof o.image === 'object') return Object.assign({kind:'image'}, o.image);
  if(o.media && typeof o.media === 'object') return Object.assign({kind:'embed'}, o.media);
  return null;
}

const EMBEDS = new WeakMap();

/* ---- fit media to the space available ----
   Given the slot's real width and height, take whichever dimension binds and
   derive the other from the ratio. This is what makes an image or an embed as
   large as it can be without overflowing the slide, and it re-runs whenever
   the available area changes -- window resize, text-size change, or the notes
   panel opening. */
function fitBox(box){
  const ar = parseFloat(box.dataset.ar);
  const slot = box.parentElement;
  if(!ar || !slot) return;
  const W = slot.clientWidth, H = slot.clientHeight;
  if(W <= 0 || H <= 0) return;                 // not laid out yet
  let w = W, h = W / ar;
  if(h > H){ h = H; w = H * ar; }
  box.style.width  = Math.floor(w) + 'px';
  box.style.height = Math.floor(h) + 'px';
}

function fitMedia(scope){
  (scope || document).querySelectorAll('.media-box.ar').forEach(fitBox);
}

/* One observer for every slot; fires when a slide becomes visible and gains a
   size, which is exactly when the first fit becomes possible. */
const fitObserver = (typeof ResizeObserver !== 'undefined')
  ? new ResizeObserver(entries => {
      entries.forEach(e => {
        const box = e.target.querySelector('.media-box.ar');
        if(box) fitBox(box);
      });
    })
  : null;

const LAYOUTS = {
  /* ---- PowerPoint-equivalent layouts ---- */
  'title': s => {
    const t = textRegion({eyebrow:s.eyebrow, heading:s.heading, headingLevel:1});
    if(s.subheading || s.byline){
      const b = el('div', 'byline');
      if(s.subheading) b.appendChild(el('strong', null, s.subheading));
      if(s.byline) b.appendChild(el('span', null, s.byline));
      t.appendChild(b);
    }
    return [t];
  },
  'title-only': s => [textRegion({eyebrow:s.eyebrow, heading:s.heading, headingLevel:1})],
  'title-content': s => [textRegion(s)],
  'section': s => {
    const t = textRegion({eyebrow:s.eyebrow, heading:s.heading, headingLevel:1});
    t.insertBefore(el('div','rule'), t.querySelector('h1') ? t.querySelector('h1').nextSibling : null);
    if(s.subheading) t.appendChild(el('div','subhead', s.subheading));
    if(s.body) t.appendChild(el('div', null, s.body));
    return [t];
  },
  'two-content': s => {
    const head = (s.heading || s.eyebrow) ? textRegion({eyebrow:s.eyebrow, heading:s.heading}) : null;
    const cols = el('div', 'cols top');
    ['left','right'].forEach(side => {
      const blk = s[side] || {};
      const m = pickMedia(blk);
      cols.appendChild(m ? figure(m, {aspect: blk.aspect}) : textRegion(blk));
    });
    return withCallout(head ? [head, cols] : [cols], s);
  },
  'comparison': s => {
    const out = [];
    if(s.heading || s.eyebrow) out.push(textRegion({eyebrow:s.eyebrow, heading:s.heading}));
    const cols = el('div', 'cols top');
    ['left','right'].forEach(side => {
      const blk = Object.assign({}, s[side] || {});
      const m = pickMedia(blk);
      const region = el('div', 'region stack');
      if(blk.subheading) region.appendChild(el('h3', null, blk.subheading));
      /* The subheading is already the column's h3; don't print it twice. */
      region.appendChild(m ? figure(m, {aspect: blk.aspect})
                           : textRegion(Object.assign({}, blk, {subheading: null})));
      cols.appendChild(region);
    });
    out.push(cols);
    return withCallout(out, s);
  },
  'content-caption': s => {
    const cols = el('div', 'cols wide-media');
    const m = pickMedia(s);
    if(m){
      const f = figure(m, {aspect: s.aspect});
      f.classList.add('media-region');
      cols.appendChild(f);
    } else {
      cols.appendChild(textRegion({body:s.body, bullets:s.bullets}));
    }
    cols.appendChild(textRegion({eyebrow:s.eyebrow, heading:s.heading, subheading:s.subheading, body:s.caption, callout:s.callout}));
    return [cols];
  },
  'picture-caption': s => {
    const m = pickMedia(s);
    const wrap = el('div', 'region stack center' + (m ? ' has-media' : ''));
    if(s.heading) wrap.appendChild(el('h2', null, s.heading));
    if(m) wrap.appendChild(figure(m, {aspect: s.aspect}));
    if(s.body) wrap.appendChild(el('div', 'caption', s.body));
    return [wrap];
  },

  /* ---- media layouts ---- */
  'media-right': s => splitMedia(s, 'right'),
  'media-left':  s => splitMedia(s, 'left'),
  'media-caption': s => {
    const m = pickMedia(s);
    const wrap = el('div', 'region stack' + (m ? ' has-media' : ''));
    if(s.eyebrow) wrap.appendChild(el('div','eyebrow', s.eyebrow));
    if(s.heading) wrap.appendChild(el('h2', null, s.heading));
    if(m) wrap.appendChild(figure(m, {aspect: s.aspect}));
    return [wrap];
  },
  'media-full': s => {
    const m = pickMedia(s);
    const out = [];
    /* Full-bleed fills the slide by definition, so it never holds a ratio —
       the image crops with object-fit and an embed takes the whole screen. */
    if(m) out.push(mediaBox(m, {fit:'cover', aspect:'auto', force:true}));
    if(s.heading || s.body || s.eyebrow){
      const scrim = ['bottom','left','none'].includes(s.scrim) ? s.scrim : 'bottom';
      const ov = el('div', 'overlay scrim-' + scrim);
      if(s.eyebrow) ov.appendChild(el('div','eyebrow', s.eyebrow));
      /* A full-bleed slide is a cover or a chapter opener: its heading is the
         biggest thing on screen, and the page's top-level heading. */
      if(s.heading) ov.appendChild(el('h1', null, s.heading));
      if(s.body) ov.appendChild(el('div', 'body', s.body));
      out.push(ov);
    }
    return out;
  },
  'cards': s => {
    const out = [];
    if(s.eyebrow || s.heading || s.subheading || s.body){
      out.push(textRegion({eyebrow:s.eyebrow, heading:s.heading, subheading:s.subheading, body:s.body}));
    }
    out.push(cardList(s.cards, !!s.numbered));
    return withCallout(out, s);
  },
  'quote': s => {
    const out = [];
    if(s.eyebrow || s.heading) out.push(textRegion({eyebrow:s.eyebrow, heading:s.heading}));
    const cols = el('div', 'cols quote-cols');
    if(s.quote) cols.appendChild(pullQuote(s.quote, s.cite, true));
    const m = pickMedia(s);
    if(m){
      const f = figure(m, {aspect: s.aspect});
      f.classList.add('media-region');
      cols.appendChild(f);
    } else if(s.subheading || s.body || (s.bullets && s.bullets.length)){
      const side = el('div', 'side-panel');
      if(s.subheading) side.appendChild(el('h3', null, s.subheading));
      if(s.body) side.appendChild(el('div', 'body', s.body));
      if(s.bullets && s.bullets.length) side.appendChild(bulletList(s.bullets));
      cols.appendChild(side);
    } else {
      cols.classList.add('top');
    }
    out.push(cols);
    return withCallout(out, s);
  },
  'grid': s => {
    const items = (s.images || []).map(i => Object.assign({kind:'image'}, i));
    const out = [];
    if(s.heading || s.eyebrow) out.push(textRegion({eyebrow:s.eyebrow, heading:s.heading}));
    const g = el('div', 'grid n' + Math.min(4, Math.max(2, items.length)));
    items.forEach(i => g.appendChild(figure(i, {fit:'cover', aspect: s.aspect || 'auto'})));
    out.push(g);
    return out;
  },
  'quad-chart': s => {
    const out = [];
    if(s.heading || s.eyebrow || s.subheading) out.push(textRegion({eyebrow:s.eyebrow, heading:s.heading, subheading:s.subheading}));
    const grid = el('div', 'quad-chart');
    (s.quads || []).forEach(quad => {
      const card = el('div', 'quad-card');
      const media = pickMedia(quad);
      card.appendChild(textRegion({subheading: quad.subheading, body: quad.body, bullets: quad.bullets}));
      if(media) card.appendChild(figure(media, {aspect: quad.aspect || s.aspect || 'auto', fit:'cover'}));
      grid.appendChild(card);
    });
    out.push(grid);
    return withCallout(out, s);
  }
};

/* Layouts whose text region is not textRegion(s) add the callout here, as
   the last thing on the slide. */
function withCallout(nodes, s){
  if(s.callout) nodes.push(callout(s.callout));
  return nodes;
}

function splitMedia(s, side){
  const cols = el('div', 'cols wide-media');
  const m = pickMedia(s);
  const text = textRegion(s);
  const media = m ? figure(m, {aspect: s.aspect}) : el('div','region');
  media.classList.add('media-region');
  if(side === 'left'){ cols.appendChild(media); cols.appendChild(text); }
  else { cols.appendChild(text); cols.appendChild(media); }
  return [cols];
}

function buildSlide(s, n){
  const layout = s.layout || 'blank';
  const d = el('div', 'slide ' + (s.cls || ''));
  d.dataset.layout = layout;

  if(layout === 'blank' || !LAYOUTS[layout]){
    // Legacy / freeform slides: raw markup, exactly as before.
    d.innerHTML = s.html || '';
  } else {
    d.classList.add('lay');
    if(layout === 'media-full') d.classList.add('bleed');
    if(layout === 'section') d.classList.add('section-head');
    LAYOUTS[layout](s).forEach(node => d.appendChild(node));
  }

  if(s.tag){
    d.classList.add('has-tag');
    d.insertBefore(el('div', 'tag', s.tag), d.firstChild);
  }
  if(s.source){
    d.classList.add('has-source');
    d.appendChild(el('footer', 'source', s.source));
  }
  const num = el('div', 'num', (n + 1) + ' / ' + SLIDES.length);
  num.setAttribute('aria-hidden', 'true');   // the slide's own label says it
  d.appendChild(num);

  /* Each slide is a labelled group ("slide, 3 of 6: heading"); inactive
     slides are display:none, so assistive tech only ever meets the current
     one. */
  d.setAttribute('role', 'group');
  d.setAttribute('aria-roledescription', 'slide');
  d.setAttribute('aria-label', slideLabel(s, n));
  return d;
}

function plainText(html){
  const t = document.createElement('div');
  t.innerHTML = html || '';
  return (t.textContent || '').replace(/\s+/g, ' ').trim();
}
function slideLabel(s, n){
  const name = plainText(s.heading) || s.title || '';
  return (n + 1) + ' of ' + SLIDES.length + (name ? ': ' + name : '');
}

SLIDES.forEach((s, n) => stage.appendChild(buildSlide(s, n)));
const els = stage.querySelectorAll('.slide');
if(fitObserver) stage.querySelectorAll('.fitslot').forEach(sl => fitObserver.observe(sl));
window.addEventListener('resize', () => fitMedia(els[i]));

/* ---- embed lifecycle ----
   Every slide lives in the DOM at once, so an iframe left mounted would keep
   a YouTube video playing (and audible) after you advance. Embeds are
   therefore created when their slide becomes active and destroyed when it
   stops being active — removing the element is what actually stops playback.
   It also means a deck with a dozen embeds loads nothing until it needs to. */

function mountEmbeds(slideEl){
  slideEl.querySelectorAll('[data-embed]').forEach(box => {
    if(box.querySelector('iframe')) return;
    const spec = EMBEDS.get(box);
    if(!spec) return;

    const frame = document.createElement('iframe');
    frame.setAttribute('allowfullscreen', '');
    frame.setAttribute('loading', 'eager');
    frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    if(spec.allow) frame.setAttribute('allow', spec.allow);
    else if(spec.external) frame.setAttribute('allow',
      'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen');

    const fb = box.querySelector('.embed-fallback');
    if(fb) fb.classList.remove('on');

    if(spec.srcdoc != null){
      /* Self-contained activity. Scripts yes, same-origin no — it can run its
         own game code but cannot reach into the deck. */
      frame.setAttribute('sandbox', spec.sandbox || 'allow-scripts allow-popups allow-forms allow-modals');
      frame.srcdoc = spec.srcdoc;
    } else if(spec.src){
      if(spec.sandbox) frame.setAttribute('sandbox', spec.sandbox);
      let timer = setTimeout(() => { if(fb) fb.classList.add('on'); }, spec.timeout || 6000);
      frame.addEventListener('load', () => clearTimeout(timer));
      frame.addEventListener('error', () => { clearTimeout(timer); if(fb) fb.classList.add('on'); });
      // A known-offline browser shouldn't sit staring at a blank frame.
      if(navigator.onLine === false && fb){ clearTimeout(timer); fb.classList.add('on'); }
      frame.src = spec.src;
    } else {
      if(fb) fb.classList.add('on');
      return;
    }
    box.appendChild(frame);
  });
}

function unmountEmbeds(slideEl){
  slideEl.querySelectorAll('[data-embed] iframe').forEach(f => f.remove());
}

function retryEmbeds(){
  const cur = els[i];
  if(!cur) return;
  unmountEmbeds(cur);
  cur.querySelectorAll('.embed-fallback').forEach(f => f.classList.remove('on'));
  mountEmbeds(cur);
}

function render(n){
  const prev = i;
  i = Math.max(0, Math.min(SLIDES.length - 1, n));
  els.forEach((e, k) => e.classList.toggle('active', k === i));
  if(els[prev] && prev !== i) unmountEmbeds(els[prev]);
  if(els[i]){ mountEmbeds(els[i]); fitMedia(els[i]); }
  notesEl.innerHTML = SLIDES[i].notes || '<i>No notes for this slide.</i>';
  if(prev !== i || !announced){
    announced = true;
    document.getElementById('announce').textContent = 'Slide ' + slideLabel(SLIDES[i], i);
  }
  if(!LIVE) location.hash = i + 1;
}
let announced = false;
function setNotes(on){
  notesOn = !!on;
  notesEl.classList.toggle('on', notesOn);
  document.body.classList.toggle('notes-on', notesOn);
  /* Measure rather than assume: the panel's height depends on how long the
     notes for this slide are. */
  document.documentElement.style.setProperty(
    '--notes-h', notesOn ? notesEl.offsetHeight + 'px' : '0px');
  requestAnimationFrame(() => fitMedia(els[i]));
}

function setBlank(on){
  blanked = !!on;
  blankEl.classList.toggle('on', blanked);
}

function liveNotesHTML(text){
  const raw = String(text || '');
  if(!raw.trim()) return '<p class="ln-empty">No live notes yet for this slide.</p>';
  const escaped = raw.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
  return '<div class="ln-text">' + escaped + '</div>';
}
function setLiveNotes(text, visible){
  if(typeof text === 'string') liveNoteText = text;
  if(typeof visible === 'boolean') liveNotesVisible = visible;
  liveNotesBodyEl.innerHTML = liveNotesHTML(liveNoteText);
  liveNotesStateEl.textContent = 'Slide ' + (i + 1) + (liveNoteText ? ' · autosaved' : '');
  liveNotesEl.classList.toggle('on', !!liveNotesVisible && !!liveNoteText.trim());
}

/* --- text size -------------------------------------------------------- */

let toastTimer = null;
function toast(big, small){
  document.getElementById('scaleval').textContent = big;
  toastEl.querySelector('span').textContent = small;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), small === 'text size' ? 900 : 2600);
}

function applyScale(v, announce){
  const num = parseFloat(v);
  /* A server predating this feature sends no `scale`, and NaN here would
     poison every calc() in the stylesheet -- the whole deck would collapse to
     default font sizes. Keep the current value instead. */
  if(!isFinite(num)) return;
  scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.round(num * 100) / 100));
  document.documentElement.style.setProperty('--scale', scale);
  requestAnimationFrame(() => fitMedia(els[i]));
  if(!LIVE) try{ localStorage.setItem('deckScale', scale); }catch(e){}
  if(announce) toast(Math.round(scale * 100) + '%', 'text size');
}

/* In live mode the server owns the value, same as the slide index, so the
   phone's readout always matches what's on the wall. If the server can't take
   the request -- most likely it was started before this feature existed --
   fall back to resizing just this screen and say so, rather than appearing to
   do nothing. */
function requestScale(body, localValue){
  if(!LIVE){ applyScale(localValue, true); return; }
  post('/api/scale', body).then(r => {
    if(r.ok) return;
    applyScale(localValue, false);
    toast(Math.round(scale * 100) + '%',
          r.status === 404 ? 'this screen only — restart the server to sync'
                           : 'this screen only — server unreachable');
  });
}
function bumpScale(steps){ requestScale({step: steps}, scale + steps * SCALE_STEP); }
function resetScale(){ requestScale({scale: 1}, 1); }

/* --- themes ----------------------------------------------------------- */

function findTheme(id){
  for(const t of THEMES) if(t.id === id) return t;
  return THEMES[0] || null;
}
/* Writes the theme's tokens onto :root. Every colour and face in the
   stylesheet reads from these, so this one call restyles the deck. */
function applyTheme(id, announce){
  const t = findTheme(id);
  if(!t) return;
  themeId = t.id;
  const root = document.documentElement.style;
  for(const key in t.vars) root.setProperty(key, t.vars[key]);
  if(!LIVE && announce) try{
    localStorage.setItem('deckTheme', themeId);
    localStorage.setItem('deckTheme:' + DECK_TITLE, themeId);
  }catch(e){}
  if(announce) toast(t.name, 'theme');
}
function requestTheme(id, announceLocally){
  if(!LIVE){ applyTheme(id, true); return; }
  post('/api/theme', {id: id}).then(r => {
    if(r.ok) return;
    applyTheme(id, false);
    toast(findTheme(id).name,
          r.status === 404 ? 'this screen only — restart the server to sync'
                           : 'this screen only — server unreachable');
  });
}
function cycleTheme(){
  if(THEMES.length < 2) return;
  let idx = THEMES.findIndex(t => t.id === themeId);
  requestTheme(THEMES[(idx + 1 + THEMES.length) % THEMES.length].id);
}

/* --- deck switcher ---------------------------------------------------- */

function renderDeckPickerList(){
  dpListEl.innerHTML = '';
  const esc = s => String(s || '').replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
  DECKS.forEach((d, idx) => {
    const isCurrent = d.id === currentDeckId;
    const isFocused = idx === dpFocusedIdx;
    const item = document.createElement('div');
    item.className = 'dp-item' + (isCurrent ? ' active' : '') + (isFocused ? ' focused' : '');
    item.id = 'dp-opt-' + idx;
    item.setAttribute('role', 'option');
    item.setAttribute('aria-selected', isFocused ? 'true' : 'false');
    if(isCurrent) item.setAttribute('aria-current', 'true');
    item.dataset.id = d.id;
    item.dataset.index = idx;

    const num = idx < 9 ? (idx + 1) : '';
    const keyHtml = num ? '<span class="dp-key">' + num + '</span>' : '';
    const badgeHtml = isCurrent ? '<span class="dp-badge">Current</span>' : '';
    const descHtml = d.subtitle ? '<div class="dp-desc">' + esc(d.subtitle) + '</div>' : '';

    item.innerHTML = keyHtml +
      '<div class="dp-info">' +
        '<div class="dp-name">' + esc(d.title || d.id) + badgeHtml + '</div>' +
        descHtml +
      '</div>' +
      '<span class="dp-count">' + (d.count || 0) + ' slides</span>';

    item.addEventListener('click', () => {
      selectDeck(d.id);
    });
    dpListEl.appendChild(item);
  });

  const focusedItem = dpListEl.querySelector('.dp-item.focused');
  if(focusedItem){
    dpListEl.setAttribute('aria-activedescendant', focusedItem.id);
    if(focusedItem.scrollIntoView) focusedItem.scrollIntoView({block: 'nearest'});
  }
}

function openDeckPicker(){
  if(!LIVE){
    toast('Live only', 'deck switching requires server');
    return;
  }
  if(!DECKS || DECKS.length < 2){
    const name = DECKS && DECKS[0] ? (DECKS[0].title || DECKS[0].id) : '1 deck';
    toast(name, 'only deck in project');
    return;
  }
  deckPickerOpen = true;
  const curIdx = DECKS.findIndex(d => d.id === currentDeckId);
  dpFocusedIdx = curIdx >= 0 ? curIdx : 0;
  renderDeckPickerList();
  /* Move focus into the dialog, and remember where it came from so closing
     puts the keyboard user back where they were. */
  dpReturnFocus = document.activeElement;
  deckPickerEl.classList.add('on');
  dpListEl.focus();
}

let dpReturnFocus = null;
function closeDeckPicker(){
  deckPickerOpen = false;
  deckPickerEl.classList.remove('on');
  if(dpReturnFocus && dpReturnFocus.focus && document.contains(dpReturnFocus)) dpReturnFocus.focus();
  dpReturnFocus = null;
}

function selectDeck(deckId){
  if(deckId === currentDeckId){
    closeDeckPicker();
    return;
  }
  closeDeckPicker();
  post('/api/deck', {id: deckId}).then(r => {
    if(!r.ok){
      toast('Failed', 'could not switch deck');
    }
  });
}

function handleDeckPickerKey(e){
  const k = e.key;
  if(k === 'Escape' || k === 'd' || k === 'D'){
    e.preventDefault();
    closeDeckPicker();
    return;
  }
  if(k === 'ArrowDown' || k === 'j' || k === 'Tab'){
    e.preventDefault();
    dpFocusedIdx = (dpFocusedIdx + 1) % DECKS.length;
    renderDeckPickerList();
    return;
  }
  if(k === 'ArrowUp' || k === 'k'){
    e.preventDefault();
    dpFocusedIdx = (dpFocusedIdx - 1 + DECKS.length) % DECKS.length;
    renderDeckPickerList();
    return;
  }
  if(k === 'Enter'){
    e.preventDefault();
    if(DECKS[dpFocusedIdx]){
      selectDeck(DECKS[dpFocusedIdx].id);
    }
    return;
  }
  if(/^[1-9]$/.test(k)){
    const num = parseInt(k, 10);
    if(num >= 1 && num <= DECKS.length){
      e.preventDefault();
      selectDeck(DECKS[num - 1].id);
      return;
    }
  }
}

deckPickerEl.addEventListener('click', e => {
  if(e.target === deckPickerEl){
    closeDeckPicker();
  }
});

/* In live mode the server owns the slide index, so navigation is a request,
   not a local change — that keeps the projector and the phone in step. */
function go(n){
  if(LIVE){ post('/api/goto', {n: n + 1}); }
  else { render(n); }
}
/* Reports whether the request actually landed. fetch() resolves normally on a
   404, so `ok` has to be checked explicitly — silently swallowing that is how
   a stale server looks identical to a broken feature. */
function post(path, body){
  return fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  }).then(r => ({ok: r.ok, status: r.status}))
    .catch(() => ({ok: false, status: 0}));
}

document.addEventListener('keydown', e => {
  if(deckPickerOpen){
    handleDeckPickerKey(e);
    return;
  }
  const k = e.key;
  if(k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown'){ e.preventDefault(); go(i + 1); }
  else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){ e.preventDefault(); go(i - 1); }
  else if(k === 'Home'){ go(0); }
  else if(k === 'End'){ go(SLIDES.length - 1); }
  else if(k === 'n' || k === 'N'){ setNotes(!notesOn); }
  else if(k === 'b' || k === 'B'){ LIVE ? post('/api/blank', {blank: !blanked}) : setBlank(!blanked); }
  else if(k === 'd' || k === 'D'){ openDeckPicker(); }
  /* '=' is the unshifted key on most layouts, so + works without Shift. */
  else if(k === '+' || k === '=' || k === 'Add'){ e.preventDefault(); bumpScale(1); }
  else if(k === '-' || k === '_' || k === 'Subtract'){ e.preventDefault(); bumpScale(-1); }
  else if(k === '0'){ e.preventDefault(); resetScale(); }
  else if(k === 't' || k === 'T'){ cycleTheme(); }
  else if(k === 'l' || k === 'L'){ if(LIVE) post('/api/live-notes-visible', {visible: !liveNotesVisible}); }
  else if(k === 'r' || k === 'R'){ retryEmbeds(); }
  else if(k === '?' || k === 'h' || k === 'H'){ toggleHelp(); }
  else if(k === 'Escape' && helpEl.classList.contains('on')){ toggleHelp(); }
  else if(k === 'f' || k === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
  }
});
stage.addEventListener('click', e => {
  if(deckPickerOpen) return;
  go(e.clientX < window.innerWidth * 0.25 ? i - 1 : i + 1);
});

if(LIVE){
  liveEl.classList.add('show');
  let es, first = true, rev = null;
  const connect = () => {
    es = new EventSource('/events');
    es.onopen = () => {
      liveEl.classList.add('ok');
      liveEl.querySelector('span').textContent = 'remote connected';
    };
    es.onmessage = ev => {
      const st = JSON.parse(ev.data);
      if(st.deck != null) currentDeckId = st.deck;
      /* The slides were baked into this page when it was served, so a deck
         change means the page itself is stale — reload rather than trying to
         swap 20 slides in place. */
      if(st.rev != null){
        if(rev == null) rev = st.rev;
        else if(st.rev !== rev){ location.reload(); return; }
      }
      const sizeChanged = st.scale != null && st.scale !== scale;
      const themeChanged = st.theme != null && st.theme !== themeId;
      render(st.n - 1);
      setBlank(st.blank);
      setLiveNotes(st.live_note || '', !!st.live_notes_visible);
      applyScale(st.scale, sizeChanged && !first && !themeChanged);
      if(st.theme != null) applyTheme(st.theme, themeChanged && !first);
      first = false;
    };
    es.onerror = () => {
      liveEl.classList.remove('ok');
      liveEl.querySelector('span').textContent = 'reconnecting…';
      es.close();
      setTimeout(connect, 1500);
    };
  };
  connect();
  render(0);
} else {
  /* Standalone: no server to remember anything, so the browser does. */
  /* A deck that names its theme opens in it; a theme the viewer picked with
     T for this deck is remembered and wins after that. */
  let saved = 1, savedTheme = null;
  try{
    saved = parseFloat(localStorage.getItem('deckScale')) || 1;
    savedTheme = localStorage.getItem('deckTheme:' + DECK_TITLE)
      || (DECK_THEME ? null : localStorage.getItem('deckTheme'));
  }catch(e){}
  applyScale(saved, false);
  applyTheme(savedTheme || DECK_THEME || themeId, false);
  const start = parseInt(location.hash.replace('#',''), 10);
  render(isNaN(start) ? 0 : start - 1);
}
</script>
</body>
</html>
